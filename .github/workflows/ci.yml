name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Why: a new push supersedes a PR's previous run; main and tags always run to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Why: callers run the committed bundle, never the sources — a stale dist/ would ship code nobody reviewed.
      - name: dist/ matches the sources
        run: pnpm build:check

  # Why: proves a caller can `uses:` the action as committed — the bundle, without installing anything — and that a plan against a fake Dokploy exits 0.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Why: the action promises Node 20 or later to its callers, while the repository itself builds on .nvmrc.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Why: the action only calls Dokploy over https; a throwaway self-signed certificate, trusted through NODE_EXTRA_CA_CERTS, keeps the smoke test off any real instance.
      - name: Start a fake Dokploy
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost \
            -keyout "$RUNNER_TEMP/fake-dokploy.key" -out "$RUNNER_TEMP/fake-dokploy.crt"
          nohup node .github/smoke/fake-dokploy.mjs "$RUNNER_TEMP/fake-dokploy.crt" "$RUNNER_TEMP/fake-dokploy.key" 8443 > "$RUNNER_TEMP/fake-dokploy.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf --cacert "$RUNNER_TEMP/fake-dokploy.crt" -H 'x-api-key: smoke-test-key-not-a-secret' https://localhost:8443/api/project.all >/dev/null && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/fake-dokploy.log"
          exit 1

      - name: Plan through the action
        uses: ./
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/fake-dokploy.crt
        with:
          api-url: https://localhost:8443/api
          api-key: smoke-test-key-not-a-secret
          manifest: .github/smoke/dokploy.yml
          mode: plan
          # Why: this job's token is read-only; the comment itself is covered by the unit tests.
          pr-comment: 'false'

      - name: The plan read Dokploy and wrote nothing
        run: |
          cat "$RUNNER_TEMP/fake-dokploy.log"
          grep -q 'GET /api/vaultProvider.listSecretNames -> 200' "$RUNNER_TEMP/fake-dokploy.log"
          grep -q 'GET /api/domain.byComposeId -> 200' "$RUNNER_TEMP/fake-dokploy.log"
          ! grep -q '^POST ' "$RUNNER_TEMP/fake-dokploy.log"

      - name: Apply through the action
        uses: ./
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/fake-dokploy.crt
        with:
          api-url: https://localhost:8443/api
          api-key: smoke-test-key-not-a-secret
          manifest: .github/smoke/dokploy.yml
          mode: apply

      - name: The apply converged the env and the domains
        run: |
          cat "$RUNNER_TEMP/fake-dokploy.log"
          grep -q 'POST /api/compose.saveEnvironment -> 200' "$RUNNER_TEMP/fake-dokploy.log"
          grep -q 'POST /api/domain.delete -> 200' "$RUNNER_TEMP/fake-dokploy.log"
          grep -q 'POST /api/domain.create -> 200' "$RUNNER_TEMP/fake-dokploy.log"
          grep -c '^POST ' "$RUNNER_TEMP/fake-dokploy.log" > "$RUNNER_TEMP/writes-after-first-apply"

      - name: Apply a second time
        uses: ./
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/fake-dokploy.crt
        with:
          api-url: https://localhost:8443/api
          api-key: smoke-test-key-not-a-secret
          manifest: .github/smoke/dokploy.yml
          mode: apply

      - name: The second apply wrote nothing
        run: |
          test "$(grep -c '^POST ' "$RUNNER_TEMP/fake-dokploy.log")" = "$(cat "$RUNNER_TEMP/writes-after-first-apply")"
